<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Drop shadow filter -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-opacity="0.3" />
    </filter>
    <!-- Gradient for pin -->
    <linearGradient id="pinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5CDB5C" />
      <stop offset="100%" stop-color="#3B9A3B" />
    </linearGradient>
    <!-- Gradient for inner circle -->
    <linearGradient id="circleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F0F0" />
    </linearGradient>
  </defs>
  
  <!-- Pin base shape with shadow -->
  <path d="M256 48c-79.5 0-144 64.5-144 144c0 51.2 25 99.6 69.3 152.2c32.9 39.2 69.1 71.5 74.7 76.8c5.6-5.3 41.8-37.6 74.7-76.8C374.9 291.6 400 243.2 400 192c0-79.5-64.5-144-144-144z" 
        fill="url(#pinGradient)" 
        filter="url(#shadow)" />
  
  <!-- Inner circle -->
  <circle cx="256" cy="176" r="80" fill="url(#circleGradient)" />
  
  <!-- X mark -->
  <g transform="translate(256, 176) scale(0.8) translate(-256, -256)">
    <path d="M342.6 150.6c8.5-8.5 8.5-22.5 0-31c-8.5-8.5-22.5-8.5-31 0L256 175l-55.6-55.6c-8.5-8.5-22.5-8.5-31 0c-8.5 8.5-8.5 22.5 0 31L225 206l-55.6 55.6c-8.5 8.5-8.5 22.5 0 31c8.5 8.5 22.5 8.5 31 0L256 237l55.6 55.6c8.5 8.5 22.5 8.5 31 0c8.5-8.5 8.5-22.5 0-31L287 206l55.6-55.6z" 
          fill="#4CAF50" />
  </g>
  
  <!-- App name -->
  <text x="256" y="380" 
        font-family="Arial, sans-serif" 
        font-weight="bold" 
        font-size="48" 
        text-anchor="middle" 
        fill="#4CAF50">
    XHere
  </text>
</svg>
